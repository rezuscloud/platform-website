version: 2

project_name: platform-website

before:
  hooks:
    # Pinned: templ v0.3.1100+ requires go >= 1.26 (runner has 1.25, GOTOOLCHAIN=local).
    # Keep in sync with the templ version in go.mod.
    - go install github.com/a-h/templ/cmd/templ@v0.3.1020
    - templ generate
    - npm ci
    - npx @tailwindcss/cli -i input.css -o assets/styles.css --minify
    - bash scripts/fetch-docs.sh

builds:
  - env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/rezuscloud/platform-website/version.Version={{.Version}}
      - -X github.com/rezuscloud/platform-website/version.GitCommit={{.ShortCommit}}
      - -X github.com/rezuscloud/platform-website/version.BuildTime={{.CommitDate}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - assets/**/*

sboms:
  - artifacts: archive

dockers_v2:
  - id: website
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/rezuscloud/platform-website
    tags:
      - v{{ .Version }}
      - v{{ .Major }}
      - v{{ .Major }}.{{ .Minor }}
      - latest
    extra_files:
      - assets
      - docs/external
      - docs/contributing
    labels:
      org.opencontainers.image.title: RezusCloud Platform Website
      org.opencontainers.image.description: RezusCloud Personal Cloud website
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.url: https://rezus.cloud
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true

docker_digest:
  name_template: digests.txt

signs:
  - cmd: cosign
    args: ["sign-blob", "--yes", "--bundle", "${signature}", "${artifact}"]
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

release:
  github:
    owner: rezuscloud
    name: platform-website
